name: Node js CI

on:
  push:
    branches: ["Himel"]

jobs:
  NodeJsCI:
    runs-on: ubuntu-latest
    name: Node js CI
    steps:
      - name: Node Js Install
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      
      - name: check node version
        run: node -v
  
  ubuntuNodeVersionCheck:
    runs-on: ubuntu-latest
    name: ubuntu version check
    steps:
      - name: just check version
        run: npm -v


